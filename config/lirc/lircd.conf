# LIRC config for Antec Fusion Remote (iMon VFD)
# The imon kernel driver handles most of this automatically.
# This file configures any supplemental IR codes.
#
# After boot, verify with: irw /dev/lirc0
# Map to Kodi keys in ~/.kodi/userdata/keymaps/remote.xml

begin remote
  name  Antec_Fusion_Remote
  flags RAW_CODES
  eps   30
  aeps  100
  gap   200000

  begin raw_codes
    # Codes populated automatically by imon driver.
    # Run 'irrecord -d /dev/lirc0 antec.conf' to record additional buttons.
  end raw_codes
end remote
