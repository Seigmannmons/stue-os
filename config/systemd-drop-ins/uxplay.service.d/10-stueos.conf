# StueOS UxPlay drop-in — tilpasser AirPlay 2-mottakeren
# Overstyrer ExecStart fra uxplay-systemd-pakken

[Service]
# Tilbakestill original kommando og sett vår
ExecStart=
ExecStart=/usr/bin/uxplay \
    -n "StueOS" \
    -nh \
    -async 2 \
    -fps 60

# Restart alltid, ikke bare ved feil
Restart=always
RestartSec=5
