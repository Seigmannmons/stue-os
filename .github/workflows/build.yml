name: Build StueOS image

on:
  push:
    branches: [main]
    paths:
      - 'build/Containerfile'
      - 'build/Justfile'
      - 'build/systemd/**'
      - 'build/firstboot.sh'
      - 'build/update-check.sh'
      - 'config/**'
      - 'scripts/**'
      - 'services/**'
      - 'setup.sh'
  schedule:
    - cron: '0 4 * * 1'   # Ukentlig rebuild mandag kl. 04:00 UTC
  workflow_dispatch:

env:
  IMAGE_NAME: stueos
  IMAGE_REGISTRY: ghcr.io/seigmannmons
  FEDORA_MAJOR_VERSION: "45"

jobs:
  build:
    name: Build and push OCI image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image with buildah
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: |
            ./build/Containerfile
          context: .
          image: ${{ env.IMAGE_NAME }}
          tags: |
            latest
            sha-${{ github.sha }}
          build-args: |
            FEDORA_MAJOR_VERSION=${{ env.FEDORA_MAJOR_VERSION }}
          oci: true
          extra-args: |
            --pull

      - name: Push to GHCR
        run: |
          IMAGE="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | buildah login ghcr.io -u ${{ github.actor }} --password-stdin
          buildah push localhost/${{ env.IMAGE_NAME }}:latest \
            docker://${IMAGE}:latest
          buildah push localhost/${{ env.IMAGE_NAME }}:latest \
            docker://${IMAGE}:sha-${{ github.sha }}
          echo "Image pushet til ${IMAGE}:latest"
