name: Build StueOS image

on:
  push:
    branches: [main]
    paths:
      - 'build/Containerfile'
      - 'build/Justfile'
      - 'build/systemd/**'
      - 'build/firstboot.sh'
      - 'build/update-check.sh'
      - 'config/**'
      - 'scripts/**'
      - 'services/**'
      - 'setup.sh'
  schedule:
    - cron: '0 4 * * 1'   # Ukentlig rebuild mandag kl. 04:00 UTC
  workflow_dispatch:

env:
  IMAGE_NAME: stueos
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  FEDORA_MAJOR_VERSION: "45"

jobs:
  build:
    name: Build and push OCI image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image with buildah
        id: build_image
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: |
            ./build/Containerfile
          context: .
          image: ${{ env.IMAGE_NAME }}
          tags: |
            latest
            sha-${{ github.sha }}
          build-args: |
            FEDORA_MAJOR_VERSION=${{ env.FEDORA_MAJOR_VERSION }}
          oci: true
          extra-args: |
            --pull

      - name: Push to GHCR
        id: push
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image digest
        run: echo "Image pushet til ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest @ ${{ steps.push.outputs.digest }}"
